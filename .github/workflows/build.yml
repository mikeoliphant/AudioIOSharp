# Builds AudioIOSharp and runs its tests on Windows and Linux. The NuGet package is packed only by release.yml.
name: Build

on:
  workflow_dispatch:
  # Every pull request gets the full check (no path filters)
  pull_request:
  # Pushes to main, except for documentation-only changes
  push:
    branches: [main]
    paths-ignore: ['**.md']

# A newer push to the same branch (or pull request) cancels the run still going for the older one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build AudioIOSharp.slnx -c Release

    - name: Test
      run: dotnet test AudioIOSharp.Tests -c Release --no-build
