# Builds AudioIOSharp and runs its tests on Windows and Linux, then packs the NuGet package (as 0.0.0-dev) and attaches
# it to the run as an artifact, for trying a change before it's released. Nothing is published.
name: Build

on:
  workflow_dispatch:
  # Every pull request gets the full check (no path filters)
  pull_request:
  # Pushes to main, except for documentation-only changes
  push:
    branches: [main]
    paths-ignore: ['**.md']

# A newer push to the same branch (or pull request) cancels the run still going for the older one
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build AudioIOSharp.slnx -c Release

    - name: Test
      run: dotnet test AudioIOSharp.Tests -c Release --no-build

  pack:
    name: Pack NuGet package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Pack
      run: dotnet pack AudioIOSharp/AudioIOSharp.csproj -c Release -o packages -p:ContinuousIntegrationBuild=true

    - name: Upload the package
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: packages/
        if-no-files-found: error
